# CI — the final check before you merge a PR into main. The job is named `check`; the main-branch
# ruleset requires it to pass (ADR-0010).
#   1. OpenSpec: everything validates, and the PR leaves no unarchived change behind (ock ship
#      archives them).
#   2. scripts/check.sh: shell syntax + shellcheck, plugin/config syntax, prompt budgets, the
#      workflow behavior tests, and the OpenCode tests (real OpenCode, fake model: request sizes,
#      guard, agents, commands).
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENSPEC_VERSION: "2.1.1"
  OPENCODE_VERSION: "2.3.2"
  OPENSPEC_TELEMETRY: "0"
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tools (OpenSpec, OpenCode)
        run: |
          npm install -g --no-fund --no-audit "@fission-ai/openspec@${OPENSPEC_VERSION}" >/dev/null
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "${OPENCODE_VERSION}" --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck >/dev/null
      - name: OpenSpec
        run: |
          openspec validate --all --no-interactive
          if [ -n "$(ls -A openspec/changes/archive 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            openspec validate --archived --no-interactive
          fi
          base="origin/${GITHUB_BASE_REF:-main}"
          left="$(git diff --name-only "$base...HEAD" -- openspec/changes \
            | awk -F/ '$3 != "archive" && NF >= 4 { print $3 }' | sort -u \
            | while read -r id; do [ -d "openspec/changes/$id" ] && echo "$id"; done || true)"
          if [ -n "$left" ]; then
            echo "::error::Unarchived OpenSpec change(s) in this PR: $left — ship with ock ship (it checks the tasks and archives them)"
            exit 1
          fi
      - name: Checks (scripts/check.sh)
        run: ./scripts/check.sh
