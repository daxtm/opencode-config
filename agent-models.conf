# opencode-config — which model does what
#
# Format:   role=provider/model-id#variant     (blank variant = the model's default)
#   The variant must be one the model offers — OpenCode lists them in the model picker (ctrl+p → model).
#   DeepSeek V4.1 Flash and GLM-5.3 Flash offer: low | high | max      GPT-6.1 Sol: low … max
#   Inline comments need a space after the `#`:  build=x/y#high # like this
# After editing: commit on a branch, ship it, merge — the kit deploys it. Check: `ock models`
#
# Plans (each has its own limits):
#   OpenCode Go   → main, build, researcher, compaction. Metered in dollars at list token prices from
#                   ONE shared allowance, so cheap-per-token models matter. Agent work is mostly cached
#                   input: the cached-input price decides most of the cost.
#   ChatGPT Plus  → spec, debugger, resolver: rare calls that need the strongest model.
#
# Go prices per 1M tokens (input / output / cached input), Nov 2026:
#   GLM-5.3-Flash 0.15 / 0.50 / 0.03 · DeepSeek V4.1 Flash 0.15 / 0.60 / 0.003

# Main session: answers, tiny edits, routes work to the agents below. Runs every turn → cheapest.
# (pi used :medium; DeepSeek V4.1 Flash has no medium variant in OpenCode, so high is the nearest.)
main=opencode-go/deepseek-v4.1-flash#high

# Writes OpenSpec changes, roadmaps and ADRs. Once per change.
spec=openai/gpt-6.1-sol#high

# Implements tasks.md, keeps scripts/check.sh green, commits. The heaviest token user.
build=opencode-go/glm-5.3-flash#high

# Root-causes failures (local checks, bug reports) and fixes them. Only when something fails.
debugger=openai/gpt-6.1-sol#high

# Resolves merge conflicts (headless, during ock ship). Rare and mechanical.
resolver=openai/gpt-6.1-sol#medium

# Web look-ups, cited briefs (/research).
researcher=opencode-go/deepseek-v4.1-flash#low

# Summarizes long sessions when the context fills up (OpenCode's compaction). Mechanical → cheapest.
compaction=opencode-go/deepseek-v4.1-flash#low
