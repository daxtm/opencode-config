# Size budgets for everything a model reads on every request. scripts/check.sh fails when a
# file goes over. This is what stops prompts from growing until the kit eats itself (ADR-0002): if a
# rule doesn't fit, it belongs in a script or the plugin, not a prompt. Raising a budget is a
# decision. Lines include the frontmatter (permissions).
# The whole-request budget (system prompt + tool definitions) is checked by scripts/test-opencode.sh.
#
# glob (relative to the repo root)   max-lines   max-words
global/AGENTS.md                     20          250
global/agents/*.md                   50          350
global/commands/*.md                 12          100
templates/project/AGENTS.md          30          260
templates/project/openspec/config.yaml 40        420
